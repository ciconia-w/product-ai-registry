id: oh-my-claudecode
name: oh-my-claudecode
version: 0.1.0
description: Multi-agent orchestration and enhancement layer for Claude Code
source:
  kind: external_git
  url: https://github.com/Yeachan-Heo/oh-my-claudecode
  ref: main
  install_method: external_package
install:
  commands:
    - /plugin marketplace add https://github.com/Yeachan-Heo/oh-my-claudecode
    - /plugin install oh-my-claudecode
  verify:
    - 'echo "Verify the oh-my-claudecode plugin is visible in the current Claude Code session"'
policy:
  role: optional
  action_on_missing: suggest
agents:
  - claude-code
os:
  - linux
notes:
  - Prefer the official Claude Code marketplace flow because installation is harness-specific
  - Use the npm runtime path only when the local Claude Code environment explicitly supports it
