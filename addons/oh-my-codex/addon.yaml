id: oh-my-codex
name: oh-my-codex
version: 0.1.0
description: Multi-agent orchestration and enhancement layer for OpenAI Codex CLI
source:
  kind: external_git
  url: https://github.com/Yeachan-Heo/oh-my-codex
  ref: main
  install_method: external_package
install:
  commands:
    - npm install -g oh-my-codex
  verify:
    - omx --help
policy:
  role: baseline
  action_on_missing: install
agents:
  - codex
os:
  - linux
notes:
  - Baseline addon for Codex users when Node.js and Codex CLI are already available
  - Follow upstream setup guidance after install to wire runtime hooks and prompts
