id: wx-cli
name: wx-cli
version: 0.1.0
description: Optional local WeChat data CLI for querying sessions, chat history, contacts, favorites, and article metadata from a signed-in desktop WeChat installation
source:
  kind: external_git
  url: https://github.com/jackwener/wx-cli
  ref: main
  install_method: external_package
  docs_url: https://github.com/jackwener/wx-cli#readme
install:
  commands:
    - npm install -g @jackwener/wx-cli
  verify:
    - wx --help
  post_install:
    - Initialize with wx init on a machine where desktop WeChat is already signed in, and follow the upstream OS-specific setup notes before relying on message queries
policy:
  role: optional
  action_on_missing: suggest
agents:
  - codex
  - claude-code
  - cursor
  - gemini-cli
  - opencode
os:
  - linux
  - macos
  - windows
notes:
  - Do not install proactively unless the task explicitly needs local WeChat data access
  - Querying real chat history depends on a live signed-in desktop WeChat environment and may require administrator privileges or macOS signing steps during initialization
