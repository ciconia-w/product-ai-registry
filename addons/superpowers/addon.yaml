id: superpowers
name: Superpowers
version: 0.1.0
description: Cross-agent enhancement suite for Codex, OpenCode, Gemini CLI, Claude Code, and other supported coding agents
source:
  kind: external_git
  url: https://github.com/obra/superpowers
  ref: main
  install_method: external_git
install:
  commands:
    - 'echo "Install Superpowers using the harness-specific upstream instructions for the current agent"'
  verify:
    - 'echo "Verify Superpowers is installed through the current agent marketplace or extension system"'
policy:
  role: optional
  action_on_missing: suggest
agents:
  - codex
  - claude-code
os:
  - linux
notes:
  - Installation differs by harness and should follow upstream marketplace or extension guidance
  - Report skipped-unsupported when the current agent lacks a supported install path
