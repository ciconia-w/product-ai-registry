name: validate-registry

on:
  pull_request:
  push:
    branches:
      - main
      - beta
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest and references
        shell: bash
        run: |
          python3 scripts/bootstrap/validate_registry.py
