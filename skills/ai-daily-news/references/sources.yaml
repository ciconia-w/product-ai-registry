# AI日报新闻源配置
# News sources configuration for AI Daily News

sources:
  # 英文源（RSS）
  english:
    primary:
      - name: "MIT Technology Review"
        url: "https://www.technologyreview.com/feed/"
        weight: 40
        max_items: 10
        language: "en"

      - name: "AI News"
        url: "https://www.artificialintelligence-news.com/feed/"
        weight: 30
        max_items: 8
        language: "en"

      - name: "MIT News AI"
        url: "https://news.mit.edu/topic/mitartificial-intelligence2-rss.xml"
        weight: 30
        max_items: 7
        language: "en"

  # 中文源
  chinese:
    # 主源（必须全部尝试）
    primary:
      - name: "hex2077.dev"
        url: "https://hex2077.dev/docs/{date:YYYY-MM}/{date:YYYY-MM-DD}/"
        method: "curl"
        weight: 60
        max_items: 25
        language: "zh"
        parser: "parse_news.py"
        required: true
      - name: "AI HOT"
        url: "https://aihot.virxact.com/daily"
        method: "direct_http_or_agent_fetch"
        weight: 40
        max_items: 20
        language: "zh"
        parser: "aihot_fetcher.py"
        required: true
        notes: "Mandatory Chinese source. First try bundled aihot_fetcher.py. If blocked, fetch the page text through agent web tools or browser automation and pipe it into aihot_parser.py."

    # 可选补充源（当前 agent 有网页抓取或浏览器能力时再使用）
    supplemental:
      - name: "AI HOT MP"
        url: "https://aihot.virxact.com/mp"
        method: "direct_http_or_agent_fetch"
        weight: 10
        max_items: 10
        language: "zh"
        optional: true
        parser: "aihot_fetcher.py"
        notes: "Optional hot-article board from AI HOT."
      - name: "新智元微信公众号"
        url: "https://mp.weixin.qq.com/s/sC39X7EsSzy79usg8am64w"
        method: "wechat_html"
        weight: 15
        max_items: 10
        language: "zh"
        optional: true
        parser: "wechat_fetcher.py"
        notes: "Optional supplemental source. Use only when the current agent can safely read or fetch the article page."

    # 备用源（仅脚本主源失败时使用，不能替代 AI HOT）
    fallback:
      - name: "量子位"
        url: "https://www.qbitai.com/feed"
        method: "rss"
        weight: 100
        max_items: 20
        language: "zh"

  # 研究源
  research:
    arxiv:
      topic: "cs.AI"
      url: "https://export.arxiv.org/rss/cs.AI"
      max_items: 3  # Top 3最新论文
      # 注意：该URL可能存在网络访问限制，已添加异常处理

# 配比设置
ratio:
  chinese: 0.65  # 中文占比 65%
  english: 0.35  # 英文占比 35%

# 其他设置
settings:
  # 英文新闻处理
  english:
    translate_title: true  # 翻译标题成中文
    include_original: true  # 包含英文原文
    include_link: true  # 包含原文链接

  # 中文源获取
  chinese:
    timeout: 30  # 超时时间（秒）
    retry: 2  # 重试次数

  # 历史记录
  history:
    keep_days: 3  # 保留3天历史
    arxiv_days: 7  # arXiv保留7天（论文去重）
