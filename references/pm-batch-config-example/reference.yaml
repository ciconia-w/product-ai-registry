id: pm-batch-config-example
name: Company PM Batch Config Example
version: 0.1.0
description: Reference for the batch JSON structure and $prev style parameter chaining used by company-pm batch execution
source:
  kind: reference
  url: file://${OPENCLI_PLUGIN_PM_LAB_PATH}/README.md
policy:
  role: reference
  action_on_missing: suggest
agents:
  - codex
  - claude-code
  - cursor
  - gemini-cli
  - opencode
