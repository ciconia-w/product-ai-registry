id: write-linglong-retrospective
name: Write Linglong Retrospective
version: 0.1.0
description: Write a structured Linglong packaging retrospective JSON and Markdown note into the target repository
entry: run.py
runtime: python
os:
  - linux
agents:
  - codex
  - claude-code
  - opencode
  - cursor
  - gemini-cli
description_scope: generic
requires:
  cli:
    - python3
permissions:
  workspace_only: true
  network: false
  destructive: false
notes:
  - Expects structured JSON on stdin describing one packaging run
  - Writes retrospective artifacts under .ai-registry/linglong-retrospectives in the target repository
