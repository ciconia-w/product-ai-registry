id: worksheet-export-json
name: Company PM Product Export JSON
version: 0.1.0
description: Export normalized product feedback requirement data as JSON through the local company-pm helper chain
entry: run.sh
runtime: bash
os:
  - linux
requires:
  cli:
    - bash
    - python3
permissions:
  network: true
  workspace_only: true
notes:
  - This script is sourced from the local company-pm plugin repository
  - Requires COMPANY_PM_APP_KEY and COMPANY_PM_SIGN for live product feedback access
