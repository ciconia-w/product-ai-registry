id: reset-linglong-builder-env
name: Reset Linglong Builder Environment
version: 0.2.0
description: Reset stale Linglong builder state, mounts, caches, and temp runtime paths before rebuilding or exporting a Linglong package on Linux
entry: run.sh
runtime: bash
os:
  - linux
agents:
  - codex
  - claude-code
  - opencode
  - cursor
  - gemini-cli
description_scope: generic
requires:
  cli:
    - bash
    - pkill
    - mount
    - grep
    - awk
    - sort
    - sudo
permissions:
  workspace_only: false
  network: false
  destructive: true
notes:
  - Intended as a generic preflight reset before Linglong build or export operations
  - Requires care because it unmounts Linglong-related mounts and moves cache directories
  - Works best when executed from the target repository root or any subdirectory inside that repository
