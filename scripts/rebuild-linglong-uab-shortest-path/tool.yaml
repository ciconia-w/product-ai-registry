id: rebuild-linglong-uab-shortest-path
name: Rebuild Linglong UAB Shortest Path
version: 0.2.0
description: Rebuild or export Linglong artifacts for the current project by preferring project-native build scripts and falling back to the generic linglong.yaml workflow
entry: run.sh
runtime: bash
os:
  - linux
agents:
  - codex
  - claude-code
  - opencode
  - cursor
  - gemini-cli
description_scope: generic
requires:
  cli:
    - bash
    - sha256sum
    - find
    - grep
    - sort
    - ll-builder
    - ll-cli
    - sudo
  scripts:
    - reset-linglong-builder-env
permissions:
  workspace_only: false
  network: false
  destructive: true
notes:
  - Prefers `scripts/build-linglong.sh` or `scripts/build-linglong-*.sh` when the target project already defines them
  - Falls back to `ll-builder build/export -f ./linglong.yaml` when only a manifest exists
  - Should be executed from the target repository root or any subdirectory inside that repository
